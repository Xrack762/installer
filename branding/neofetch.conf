# MCR Server OS neofetch config (fallback when fastfetch is unavailable).
# Installed to ~/.config/neofetch/config.conf for root + /etc/skel + existing
# users. The custom ascii logo + the os override below make the title/OS line
# read "MCRSOFT BY WOBOO.IO".
print_info() {
    info title
    info underline
    # Force the branded OS string regardless of the underlying distro:
    prin "OS" "MCRSOFT BY WOBOO.IO"
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "CPU" cpu
    info "Memory" memory
    info "Disk" disk
    info "Local IP" local_ip
    info cols
    prin "Managed by" "MCR Server OS  ·  https://woboo.io"
}

# Branded title line
title_fqdn="off"

# ASCII art source (custom MCRSOFT logo installed alongside)
image_backend="ascii"
ascii_distro="auto"
ascii_colors=(6 6 6 6 6 6)
ascii_bold="on"
# neofetch reads a custom logo via --ascii /etc/mcrsoft/logo.txt (set by wrapper)
